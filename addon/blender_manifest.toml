schema_version = "1.0.0"

id = "localtext3d"
version = "1.6.4"
name = "Local Text to 3D"
tagline = "Local text-to-3D meshes, Geometry Nodes and a GUI agent"
maintainer = "Local Text to 3D"
type = "add-on"
tags = ["Add Mesh", "Object"]
blender_version_min = "5.1.0"
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Local Text to 3D",
]

# Extension validator: tagline and each permission reason must be <= 64 chars.
[permissions]
network = "Talk to the local worker, GUI Agent sidecar and Ollama"
files = "Import generated GLBs and write GN instruction text files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
